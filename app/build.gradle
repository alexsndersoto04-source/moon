plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.airgesture.transfer'
    compileSdk 34

    defaultConfig {
        applicationId "com.airgesture.transfer"
        minSdk 29
        targetSdk 34
        versionCode 9
        versionName "1.5.1"

        // Redmi 9C (Helio G35) is 64-bit; armeabi-v7a keeps 32-bit devices working.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            // A *stable* key is required so new builds install over previous ones.
            // `ci/airgesture-ci.jks` is generated once by the workflow and committed
            // by CI. Its password is public on purpose: this is a side-load build,
            // not a Play Store signing key. Replace it for any real distribution.
            def ciKeyStore = rootProject.file("ci/airgesture-ci.jks")
            if (ciKeyStore.exists()) {
                storeFile ciKeyStore
                storePassword "airgesture"
                keyAlias "airgesture"
                keyPassword "airgesture"
            } else {
                // Local fallback: the debug keystore created by Android Studio / AGP.
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    androidResources {
        // The MediaPipe .task bundle must stay uncompressed so MediaPipe can
        // mmap it straight from the APK instead of unpacking it to disk.
        noCompress += ['task', 'tflite']
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // --- Core / UI ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.1'

    // --- Lifecycle / Coroutines (background processing) ---
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // --- CameraX: 480p analysis stream off the UI thread ---
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // --- MediaPipe Tasks Vision: hand landmarker (21 keypoints, LIVE_STREAM) ---
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // --- Google Nearby Connections: P2P over Wi-Fi Direct / BLE, no internet ---
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}

// ---------------------------------------------------------------------------
// MediaPipe model provisioning
// ---------------------------------------------------------------------------
// The hand landmarker bundle (~7 MB) is not committed to keep the repository
// light. This task downloads it once, with retries, before assets are merged.
def handModelFile = file("$projectDir/src/main/assets/hand_landmarker.task")
def handModelUrls = [
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task"
]

tasks.register("downloadHandModel") {
    group = "build"
    description = "Downloads the MediaPipe hand_landmarker.task model into app/src/main/assets when missing."

    doLast {
        if (handModelFile.exists() && handModelFile.length() > 1_000_000L) {
            logger.lifecycle("MediaPipe hand model already present (${handModelFile.length()} bytes).")
            return
        }
        handModelFile.parentFile.mkdirs()
        def partial = new File(handModelFile.parentFile, handModelFile.name + ".part")
        def errors = []
        for (String url : handModelUrls) {
            for (int attempt = 1; attempt <= 3; attempt++) {
                try {
                    logger.lifecycle("Downloading MediaPipe hand model (attempt $attempt): $url")
                    partial.delete()
                    new URL(url).withInputStream { input ->
                        partial.withOutputStream { output -> output << input }
                    }
                    if (partial.length() < 1_000_000L) {
                        throw new IOException("Downloaded file is too small (${partial.length()} bytes).")
                    }
                    if (!partial.renameTo(handModelFile)) {
                        java.nio.file.Files.copy(partial.toPath(), handModelFile.toPath(),
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        partial.delete()
                    }
                    logger.lifecycle("MediaPipe hand model ready: ${handModelFile.length()} bytes.")
                    return
                } catch (Exception e) {
                    errors << "$url #$attempt -> ${e.message}"
                    sleep(1500L * attempt)
                }
            }
        }
        throw new GradleException("Unable to download the MediaPipe hand model.\n" +
                "Download it manually from:\n  ${handModelUrls[0]}\n" +
                "and place it at:\n  ${handModelFile}\nDetails:\n  " + errors.join("\n  "))
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("downloadHandModel")
}
