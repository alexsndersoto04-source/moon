pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "AirGestureTransfer"
include ':app'

// Moon Avatar: app independiente (applicationId com.moon.avatar).
// Vive en avatar-app/ y NO comparte código ni APK con AirGesture Transfer.
include ':avatar'
project(':avatar').projectDir = file('avatar-app')
