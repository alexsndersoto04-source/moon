name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the APK as a downloadable GitHub Release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      # Fail closed rather than generating a new signing key or pushing from CI.
      - name: Check release signing keystore
        run: test -f ci/airgesture-ci.jks

      - name: Build release + debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        continue-on-error: true
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          # Kotlin/aapt errors are surfaced as annotations so they can be read
          # straight from the run summary without downloading the log.
          grep -E "^(e: |w: .*error)|error:|What went wrong|Caused by:" build.log \
            | head -15 \
            | while IFS= read -r line; do
                echo "::error ::$(echo "$line" | cut -c1-900)"
              done

      - name: Upload Gradle log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore


      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/AirGestureTransfer-1.7.1.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/AirGestureTransfer-1.7.1-debug.apk"
          ls -lh artifacts
          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt

      # Hard gate: a green run means the APK is actually installable.
      - name: Verify APK (model bundled, ABIs present, signature valid)
        run: |
          set -euo pipefail
          APK=artifacts/AirGestureTransfer-1.7.1.apk

          echo "--- MediaPipe model inside the APK (must be Stored, not Defl) ---"
          unzip -v "$APK" | grep "hand_landmarker.task" | tee model.txt
          grep -qi "stored" model.txt

          # A truncated or HTML-error download would still be "Stored": assert the
          # real payload too, so a model that cannot detect anything fails the
          # build instead of reaching a phone.
          MODEL_BYTES=$(unzip -l "$APK" | awk '/hand_landmarker.task/ {print $1}' | head -1)
          echo "hand_landmarker.task = $MODEL_BYTES bytes"
          test "$MODEL_BYTES" -gt 5000000

          echo "--- Native ABIs ---"
          unzip -l "$APK" | grep -oE "lib/(arm64-v8a|armeabi-v7a)/[^ ]+" | cut -d/ -f2 | sort -u | tee abis.txt
          grep -qx "arm64-v8a" abis.txt

          echo "--- DEX count ---"
          unzip -l "$APK" | grep -cE "classes[0-9]*\.dex"

          echo "--- Permissions that make BLE discovery work ---"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          "$BUILD_TOOLS_DIR/aapt2" dump permissions "$APK" > perms.txt
          cat perms.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" perms.txt
          grep -q "android.permission.BLUETOOTH_SCAN" perms.txt
          grep -q "android.permission.BLUETOOTH_ADVERTISE" perms.txt
          grep -q "android.permission.NEARBY_WIFI_DEVICES" perms.txt

          echo "--- Signature ---"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -6

      - name: Upload debug symbols / mapping (best effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirGestureTransfer-apk
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish APK release
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: AirGestureTransfer-apk
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.7.1-build${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "AirGesture Transfer 1.7.1 (build ${{ github.run_number }})" \
            --notes "APK generado automáticamente por GitHub Actions desde el commit ${{ github.sha }}.

          Instalación: descarga AirGestureTransfer-1.7.1.apk en el teléfono e instala la versión.

          Commit: ${{ github.sha }}
          Firmado con la identidad de distribución configurada para este proyecto." \
            artifacts/*.apk artifacts/SHA256SUMS.txt
