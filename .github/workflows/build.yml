name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the APK as a downloadable GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Prepare debug keystore (used to sign the release APK)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release + debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee build.log

      - name: Upload Gradle log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      # TEMPORARY: same trick as before, so the agent can read compiler output.
      - name: Publish build log on failure
        if: failure() && github.event_name == 'push'
        run: |
          mkdir -p ci
          head -c 400000 build.log > ci/last-build.log || true
          git config user.email "ci@airgesture.local"
          git config user.name "AirGesture CI"
          git add ci/last-build.log
          git commit -m "ci: build log for ${{ github.sha }} [skip ci]" || true
          git push

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/AirGestureTransfer-1.0.0.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/AirGestureTransfer-1.0.0-debug.apk"
          ls -lh artifacts
          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt

      # Hard gate: a green run means the APK is actually installable.
      - name: Verify APK (model bundled, ABIs present, signature valid)
        run: |
          set -euo pipefail
          APK=artifacts/AirGestureTransfer-1.0.0.apk

          echo "--- MediaPipe model inside the APK (must be Stored, not Defl) ---"
          unzip -v "$APK" | grep "hand_landmarker.task" | tee model.txt
          grep -qi "stored" model.txt

          echo "--- Native ABIs ---"
          unzip -l "$APK" | grep -oE "lib/(arm64-v8a|armeabi-v7a)/[^ ]+" | cut -d/ -f2 | sort -u | tee abis.txt
          grep -qx "arm64-v8a" abis.txt

          echo "--- DEX count ---"
          unzip -l "$APK" | grep -cE "classes[0-9]*\.dex"

          echo "--- Signature ---"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -6

      - name: Upload debug symbols / mapping (best effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirGestureTransfer-apk
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "AirGesture Transfer 1.0.0 (build ${{ github.run_number }})" \
            --notes "APK generado automáticamente por GitHub Actions desde \`${{ github.sha }}\`.

          **Instalación:** descarga \`AirGestureTransfer-1.0.0.apk\` en el teléfono, permite «Instalar apps de origen desconocido» para tu navegador y ábrelo.

          - Compilado: $(date -u +'%Y-%m-%d %H:%M UTC')
          - Commit: \`${{ github.sha }}\`
          - Variante: release (minify off) firmado con la keystore de CI" \
            artifacts/*.apk artifacts/SHA256SUMS.txt
