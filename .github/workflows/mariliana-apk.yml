name: Mariliana APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/690a9141-moon
    paths:
      - 'mariliana/**'
      - '.github/workflows/mariliana-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar y probar Mariliana
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mariliana/package-lock.json
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        working-directory: mariliana
        run: npm ci
      - name: Probar inventario y sincronización
        working-directory: mariliana
        run: npm test
      - name: Preparar proyecto Android
        working-directory: mariliana
        run: npx cap sync android
      - name: Compilar APK de prueba
        working-directory: mariliana/android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Guardar APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Mariliana-APK
          path: mariliana/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publicar APK de prueba con enlace directo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mariliana/android/app/build/outputs/apk/debug/app-debug.apk Mariliana.apk
          gh release create "mariliana-prueba-${GITHUB_RUN_ID}" Mariliana.apk \
            --target "$GITHUB_SHA" \
            --title "Mariliana · APK de prueba" \
            --notes "APK de prueba firmado para depuración. La sincronización entre teléfonos requiere configurar un servidor HTTPS compartido. Antes de usar datos reales, prueba la cámara, los movimientos y las copias de seguridad." \
            --prerelease
