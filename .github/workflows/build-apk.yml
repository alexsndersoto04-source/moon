name: Build APK

# Genera el .apk instalable sin que necesites Android Studio ni el SDK local.
# Cada push a main o a una rama arena/ sube un artefacto MoonShare-debug.apk.
#
# Si la compilación falla, el workflow abre/actualiza un issue con la lista de
# errores del compilador. Es deliberado: el log de Actions vive en un host
# distinto al API y no siempre es legible desde un entorno restringido, mientras
# que los issues se leen por la API normal. Así el feedback del build es
# accesible desde cualquier cliente de la API.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante a compilar'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read
  issues: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar MoonShare (${{ github.event.inputs.variant || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar Gradle 8.9 (sin depender del wrapper jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          VARIANT="${{ github.event.inputs.variant || 'debug' }}"
          gradle --no-daemon --console=plain "assemble${VARIANT^}" 2>&1 | tee /tmp/build.log

      - name: Localizar el APK
        id: find
        if: success()
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "no se encontró el APK" >&2; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          {
            echo "## ✅ APK generado"
            echo
            echo '```'
            ls -la "$APK"
            echo '```'
            echo
            echo "Descargalo de la pestaña **Artifacts** → \`moonshare-apk\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moonshare-apk
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------ fallo
      - name: Reportar errores de compilación en un issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Errores de Kotlin (e: file://...), de AGP y el bloque "What went wrong".
          {
            echo "## ❌ MoonShare no compiló"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- rama: \`${GITHUB_REF_NAME}\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            grep -E "^e: file:|^> Task .*FAILED|^error:|Caused by:|what went wrong" -i /tmp/build.log \
              | sed 's|/home/runner/work/[^/]*/[^/]*/||g' \
              | head -120
            echo '```'
          } > /tmp/report.md

          if [ ! -s /tmp/report.md ]; then
            { echo "## ❌ MoonShare no compiló (sin errores parseables)"; echo; echo '```'; tail -120 /tmp/build.log; echo '```'; } > /tmp/report.md
          fi

          TITLE="🔧 Fallo de build de MoonShare"
          BODY="$(cat /tmp/report.md)"

          # El label tiene que existir antes de asignarse, si no la API responde 422.
          gh api -X PUT "repos/$GITHUB_REPOSITORY/labels/ci-build-failure" \
            -f name="ci-build-failure" -f color="e11d48" >/dev/null 2>&1 || true

          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=ci-build-failure" \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$EXISTING" \
              -f title="$TITLE" -f body="$BODY" >/dev/null 2>&1 ||
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$EXISTING/comments" \
                -f body="$BODY" >/dev/null 2>&1 || true
            echo "reporte actualizado en #$EXISTING"
          else
            NUM=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues" \
              -f title="$TITLE" -f body="$BODY" --jq '.number' 2>/dev/null || echo "")
            if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$NUM/labels" \
                -f "labels[]=ci-build-failure" >/dev/null 2>&1 || true
              echo "reporte publicado en #$NUM"
            fi
          fi
          # Doble canal: si la API de issues estuviera cerrada, el resumen del job
          # igual queda visible en la UI de Actions.
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
