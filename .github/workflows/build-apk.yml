name: Build APK

# Genera el .apk instalable sin que necesites Android Studio ni el SDK local.
# Cada push a main o a una rama arena/ sube un artefacto MoonShare-debug.apk.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante a compilar'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar MoonShare (${{ github.event.inputs.variant || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar Gradle 8.9 (sin depender del wrapper jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compilar
        run: |
          VARIANT="${{ github.event.inputs.variant || 'debug' }}"
          gradle --no-daemon "assemble${VARIANT^}" \
            -Pandroid.sdk.channel=3 \
            --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Localizar el APK
        id: find
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "## APK: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$(dirname "$APK")" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: moonshare-apk
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error
          retention-days: 30
