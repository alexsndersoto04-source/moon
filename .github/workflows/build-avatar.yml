name: Build Moon Avatar APK

# Workflow PROPIO del avatar: no toca el de AirGesture Transfer.
on:
  push:
    branches: [ main, 'arena/**' ]
    paths:
      - 'avatar-app/**'
      - '.github/workflows/build-avatar.yml'
      - 'settings.gradle'
      - 'build.gradle'
  pull_request:
    branches: [ main ]
    paths:
      - 'avatar-app/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-avatar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Moon Avatar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Ensure debug keystore (fallback signing)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Moon Avatar release + debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :avatar:assembleRelease :avatar:assembleDebug 2>&1 | tee build-avatar.log

      - name: Report compile errors
        if: failure()
        continue-on-error: true
        run: |
          if [ ! -f build-avatar.log ]; then exit 0; fi
          grep -E "^(e: |w: .*error)|error:|What went wrong|Caused by:" build-avatar.log \
            | head -15 \
            | while IFS= read -r line; do
                echo "::error ::$(echo "$line" | cut -c1-900)"
              done

      - name: Collect APKs
        run: |
          mkdir -p artifacts-avatar
          cp avatar-app/build/outputs/apk/release/avatar-release.apk "artifacts-avatar/MoonAvatar-1.0.0.apk"
          cp avatar-app/build/outputs/apk/debug/avatar-debug.apk "artifacts-avatar/MoonAvatar-1.0.0-debug.apk"
          ls -lh artifacts-avatar
          sha256sum artifacts-avatar/*.apk | tee artifacts-avatar/SHA256SUMS.txt

      - name: Verify APK (signature valid, is the avatar app)
        run: |
          set -euo pipefail
          APK=artifacts-avatar/MoonAvatar-1.0.0.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -3
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q "com.moon.avatar"
          echo "--- 3D empaquetado en el APK (modelo, motor y animaciones) ---"
          unzip -l "$APK" | grep -E "assets/(avatar_model.glb|avatar3d.html|lib/three.min.js|lib/GLTFLoader.js|anim/idle.glb|anim/talking.glb|anim/celebrate.glb)"
          for f in avatar_model.glb avatar3d.html lib/three.min.js anim/idle.glb model-data.js; do
            unzip -l "$APK" | grep -q "assets/$f" || { echo "FALTA assets/$f en el APK"; exit 1; }
          done
          DATA_BYTES=$(unzip -l "$APK" | awk '/model-data.js/ {print $1}' | head -1)
          echo "model-data.js = $DATA_BYTES bytes (modelo+anims en base64)"
          test "$DATA_BYTES" -gt 5000000
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -6

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonAvatar-apk
          path: artifacts-avatar/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="avatar-v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Moon Avatar 1.0.0 (build ${{ github.run_number }})" \
            --notes "Avatar personal con cerebro de IA (Gemini/Groq), voz, gestos y memoria local. App independiente de AirGesture Transfer.

          **Instalación:** descarga \`MoonAvatar-1.0.0.apk\` en el teléfono, permite «Instalar apps de origen desconocido» y ábrelo. Al abrir ⚙️ Ajustes puedes poner tu API key gratuita (Gemini o Groq), su nombre, personalidad y apariencia.

          - Compilado: $(date -u +'%Y-%m-%d %H:%M UTC')
          - Commit: \`${{ github.sha }}\`" \
            artifacts-avatar/*.apk artifacts-avatar/SHA256SUMS.txt
