plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Moon Avatar — app INDEPENDIENTE de AirGesture Transfer.
// applicationId distinto => se instala como otra app, sin tocar la anterior.

android {
    namespace 'com.moon.avatar'
    compileSdk 34

    defaultConfig {
        applicationId "com.moon.avatar"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "0.3.0"
    }

    signingConfigs {
        release {
            def ciKeyStore = rootProject.file("ci/airgesture-ci.jks")
            if (ciKeyStore.exists()) {
                storeFile ciKeyStore
                storePassword "airgesture"
                keyAlias "airgesture"
                keyPassword "airgesture"
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
