<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AirGesture 2.0 · vista previa del efecto</title>
<style>
  :root {
    --ivory: #fdfcfa;
    --ink: #17171a;
    --ink-soft: #5c5c63;
    --ink-faint: #9a9aa1;
    --hairline: #eceae6;
    --accent: #b4855c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ivory);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }
  header {
    padding: 22px 26px 6px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px;
  }
  h1 {
    font-weight: 300;
    font-size: 22px;
    letter-spacing: .01em;
    margin: 0;
  }
  header span {
    color: var(--ink-faint);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  #stage { position: relative; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #shelf {
    position: absolute;
    left: 0; right: 0; bottom: 10%;
    display: flex;
    justify-content: center;
    gap: 14px;
    pointer-events: none;
  }
  .card {
    width: 104px; height: 128px;
    border-radius: 16px;
    background: linear-gradient(150deg, #efe7dc, #d8c9b4 55%, #b9a189);
    border: 1px solid var(--hairline);
    box-shadow: 0 8px 22px rgba(23,23,26,.06);
  }
  .card.mid { transform: scale(1.045) translateY(-3px); border-color: var(--ink); }
  footer {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px 26px 24px;
  }
  button {
    appearance: none;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    border-radius: 999px;
    padding: 11px 20px;
    font-size: 13px;
    letter-spacing: .01em;
    cursor: pointer;
  }
  button.ghost {
    background: #fff;
    color: var(--ink-soft);
    border-color: #dedbd5;
  }
  button:active { transform: scale(.96); }
  .legend {
    color: var(--ink-faint);
    font-size: 11px;
    line-height: 1.6;
    margin-left: auto;
    text-align: right;
  }
  .legend b { color: var(--ink-soft); font-weight: 500; }
  @media (max-width: 560px) {
    .legend { margin-left: 0; text-align: left; }
  }
</style>
</head>
<body>
  <header>
    <h1>AirGesture <span style="color:var(--ink-faint)">2.0</span></h1>
    <span>singularidad · haz · llegada</span>
  </header>

  <div id="stage">
    <canvas id="fx"></canvas>
    <div id="shelf">
      <div class="card"></div>
      <div class="card mid"></div>
      <div class="card"></div>
    </div>
  </div>

  <footer>
    <button id="send">Enviar archivo</button>
    <button id="arrive" class="ghost">Simular llegada</button>
    <button id="loop" class="ghost">Repetir</button>
    <div class="legend">
      <b>0,00</b> el anillo cae · <b>0,36</b> el núcleo · <b>0,34</b> el haz · <b>0,78</b> la onda<br />
      Misma matemática que <code>TransferBeamView.kt</code>: degradados radiales escalados, cero trazos.
    </div>
  </footer>

<script>
(() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth;
    H = stage.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---- easing: cubic-bezier solver (same curves the Kotlin view uses) ----
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sampleX = t => ((ax * t + bx) * t + cx) * t;
    const sampleY = t => ((ay * t + by) * t + cy) * t;
    const sampleDX = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 6; i++) {
        const dx = sampleX(t) - x;
        if (Math.abs(dx) < 1e-5) break;
        const d = sampleDX(t);
        if (Math.abs(d) < 1e-6) break;
        t -= dx / d;
      }
      t = Math.min(1, Math.max(0, t));
      return sampleY(t);
    };
  }
  const gatherEase = bezier(0.36, 0, 0.2, 1);
  const launchEase = bezier(0.1, 0.72, 0.16, 1);
  const fadeEase = bezier(0.4, 0, 0.2, 1);

  // ---- shaders, built once against a unit radius ----
  const SHADOW = '#2b2b30';
  const ACCENT = '#b4855c';
  const DENSITY = 1;

  function white(a) { return `rgba(255,255,255,${a / 255})`; }

  function unitGradient(stops) {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    stops.forEach(([pos, color]) => grad.addColorStop(pos, color));
    g.fillStyle = grad;
    g.fillRect(0, 0, 256, 256);
    return c;
  }

  const coreTex = unitGradient([
    [0, white(255)], [0.28, white(245)], [0.55, white(150)],
    [0.78, `rgba(180,133,92,${95 / 255})`], [1, white(0)]
  ]);
  const bloomTex = unitGradient([[0, white(130)], [0.42, white(34)], [1, white(0)]]);
  const ringTex = unitGradient([
    [0, white(0)], [0.62, white(0)], [0.775, `rgba(43,43,48,${36 / 255})`],
    [0.845, white(190)], [1, white(0)]
  ]);
  const streakTex = unitGradient([[0, white(235)], [0.34, white(110)], [1, white(0)]]);

  // Capsule texture for the beam: soft across, bright head, vanishing tail.
  const beamTex = (() => {
    const w = 64, h = 256;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    for (let y = 0; y < h; y++) {
      const ny = (y / (h - 1)) * 2 - 1;
      let vertical = Math.exp(-((ny + 0.35) ** 2) / 0.9);
      vertical *= Math.max(0, 1 - Math.pow((ny + 1) / 2, 2.4));
      for (let x = 0; x < w; x++) {
        const nx = (x / (w - 1)) * 2 - 1;
        const side = Math.max(0, 1 - Math.pow(Math.abs(nx), 3));
        const a = Math.round(255 * side * Math.max(0, Math.min(1, vertical)));
        if (a > 0) {
          g.fillStyle = `rgba(255,255,255,${a / 255})`;
          g.fillRect(x, y, 1, 1);
        }
      }
    }
    return c;
  })();

  // 18 deterministic motes, same seeds as the Kotlin view
  const SPARKS = 18;
  const sparkAngle = [], sparkStart = [], sparkSize = [];
  (() => {
    let seed = 20261114;
    const rnd = () => {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    };
    for (let i = 0; i < SPARKS; i++) {
      sparkAngle.push(rnd() * Math.PI * 2);
      sparkStart.push(0.45 + rnd() * 0.55);
      sparkSize.push(0.6 + rnd() * 1.2);
    }
  })();

  let progress = 0, arrival = false, running = false, startAt = 0, globalFade = 1;
  let cx = 0, cy = 0, reach = 1;

  const cardBuffer = document.createElement('canvas');
  const cardCtx = cardBuffer.getContext('2d');

  function drawTexture(tex, x, y, rx, ry, alpha) {
    if (alpha <= 0 || rx <= 0 || ry <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha / 255) * globalFade;
    ctx.translate(x, y);
    ctx.scale(rx, ry);
    ctx.drawImage(tex, -1, -1, 2, 2);
    ctx.restore();
  }

  function drawBloom(t) {
    const grow = gatherEase(Math.min(1, Math.max(0, t / 0.45)));
    const fade = 1 - fadeEase(Math.min(1, Math.max(0, (t - 0.5) / 0.5)));
    const alpha = 135 * (0.4 + grow * 0.6) * fade;
    drawTexture(bloomTex, cx, cy, reach * (0.16 + grow * 0.5), reach * (0.16 + grow * 0.5) * 0.9, alpha);
  }

  function drawRing(t) {
    const close = Math.min(1, Math.max(0, t / 0.34));
    if (close < 1) {
      const eased = gatherEase(close);
      const radius = reach * (0.9 - 0.86 * eased) + 12 * DENSITY;
      const alpha = 210 * Math.sin(Math.PI * close);
      drawTexture(ringTex, cx, cy, radius, radius * 0.94, alpha);
    }
    const wave = Math.min(1, Math.max(0, (t - 0.28) / 0.44));
    if (wave > 0 && wave < 1) {
      const radius = 16 * DENSITY + launchEase(wave) * reach * 1.12;
      const fade = (1 - wave) * (1 - wave);
      drawTexture(ringTex, cx, cy, radius, radius * 0.92, 170 * fade);
    }
  }

  function drawSparks(t) {
    const pull = gatherEase(Math.min(1, Math.max(0, t / 0.4)));
    if (pull >= 1) return;
    const alpha = 225 * (1 - pull) * (1 - pull * 0.4);
    if (alpha <= 2) return;
    for (let i = 0; i < SPARKS; i++) {
      const angle = sparkAngle[i] + pull * 1.5;
      const radius = reach * sparkStart[i] * (1 - pull) + 7 * DENSITY * pull;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius * 0.92;
      const size = sparkSize[i] * (6.6 - 3.8 * pull) * DENSITY;
      drawTexture(streakTex, x, y, size, size, alpha);
    }
  }

  function drawCard(t) {
    const shrink = gatherEase(Math.min(1, Math.max(0, (t - 0.04) / 0.34)));
    const scale = 1 - 0.93 * shrink;
    const fade = 1 - fadeEase(Math.min(1, Math.max(0, (t - 0.12) / 0.28)));
    const alpha = 255 * fade;
    if (alpha <= 2 || scale <= 0.02) return;

    const base = Math.min(Math.max(Math.min(W, H) * 0.135, 46), 78);
    const radius = base * scale;
    const rotation = (11 * shrink * (arrival ? -1 : 1)) * Math.PI / 180;

    const side = Math.ceil(radius * 2.7);
    if (side < 8) return;
    cardBuffer.width = cardBuffer.height = side;
    cardCtx.clearRect(0, 0, side, side);

    // the "photo": a warm gradient card, exactly the shelf card
    const g = cardCtx.createLinearGradient(0, 0, side, side);
    g.addColorStop(0, '#efe7dc');
    g.addColorStop(0.55, '#d8c9b4');
    g.addColorStop(1, '#b9a189');
    const inset = (side - radius * 2) / 2;
    cardCtx.fillStyle = g;
    cardCtx.beginPath();
    cardCtx.roundRect(inset, inset, radius * 2, radius * 2, radius * 0.22);
    cardCtx.fill();

    // feather the edge into nothing
    const mask = cardCtx.createRadialGradient(side / 2, side / 2, 0, side / 2, side / 2, side / 2);
    mask.addColorStop(0, 'rgba(0,0,0,1)');
    mask.addColorStop(0.7, 'rgba(0,0,0,1)');
    mask.addColorStop(1, 'rgba(0,0,0,0)');
    cardCtx.globalCompositeOperation = 'destination-in';
    cardCtx.fillStyle = mask;
    cardCtx.fillRect(0, 0, side, side);
    cardCtx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha / 255) * globalFade;
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.drawImage(cardBuffer, -side / 2, -side / 2, side, side);
    // light from the upper left
    drawTexture(bloomTex, -radius * 0.32, -radius * 0.38, radius * 0.85, radius * 0.85, alpha * 0.32);
    ctx.restore();
  }

  function drawBeamLayer(top, length, halfWidth, alpha, tint) {
    if (alpha <= 2) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha / 255) * globalFade;
    ctx.drawImage(beamTex, cx - halfWidth, top, halfWidth * 2, length);
    ctx.restore();
  }

  function drawBeam(t) {
    const local = Math.min(1, Math.max(0, (t - 0.34) / 0.44));
    if (local <= 0) return;
    const grow = launchEase(local);
    const fade = 1 - Math.min(1, Math.max(0, (t - 0.76) / 0.24));
    if (fade <= 0.02) return;

    const maxLength = (cy - H * 0.10) / 0.52;
    const length = 70 * DENSITY + grow * Math.min(H * 0.92, Math.max(maxLength, 120 * DENSITY));
    const halfWidth = (13 + (1 - grow) * 13) * DENSITY;
    const top = cy - length * 0.72;
    const alpha = 245 * grow * fade;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawBeamLayer(top, length, halfWidth * 2.4, alpha * 0.6);
    drawBeamLayer(top, length, halfWidth * 1.25, alpha);
    // muzzle glow at the phone
    drawTexture(bloomTex, cx, cy, halfWidth * 2.2, halfWidth * 2.2 * 0.9, 150 * grow * fade);
    ctx.restore();
  }

  function drawCore(t) {
    const z = (t - 0.36) / 0.11;
    const flash = Math.exp(-(z * z));
    if (flash <= 0.01) return;
    const radius = (13 + 52 * flash) * DENSITY;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawTexture(coreTex, cx, cy, radius, radius, 255 * flash);
    drawTexture(bloomTex, cx, cy, radius * 4.6, radius * 4.6 * 0.09, 255 * flash * 0.45);
    ctx.restore();
  }

  function frame(now) {
    if (!running) return;
    progress = Math.min(1, (now - startAt) / 1050);
    globalFade = arrival ? Math.min(1, (1 - progress) / 0.12) : 1;

    ctx.clearRect(0, 0, W, H);

    const t = arrival ? 1 - progress : progress;
    cx = W * 0.5;
    cy = H * 0.40;
    reach = Math.max(
      Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)),
      1
    );

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    drawBloom(t);
    drawRing(t);
    drawSparks(t);
    drawCard(t);
    drawBeam(t);
    drawCore(t);

    ctx.globalAlpha = 1;
    if (progress >= 1) {
      running = false;
      ctx.clearRect(0, 0, W, H);
      if (looping) setTimeout(() => start(loopingArrival), 500);
      return;
    }
    requestAnimationFrame(frame);
  }

  let looping = false, loopingArrival = false;
  function start(isArrival) {
    arrival = !!isArrival;
    startAt = performance.now();
    running = true;
    requestAnimationFrame(frame);
  }

  document.getElementById('send').onclick = () => { looping = false; start(false); };
  document.getElementById('arrive').onclick = () => { looping = false; start(true); };
  document.getElementById('loop').onclick = (e) => {
    looping = !looping;
    e.target.textContent = looping ? 'Detener' : 'Repetir';
    if (looping) start(loopingArrival);
  };

  // present without a click
  setTimeout(() => { looping = true; start(false); }, 350);
})();
</script>
</body>
</html>
