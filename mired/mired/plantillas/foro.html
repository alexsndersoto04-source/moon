<section class="panel">
  <div class="fila-titulo">
    <h1>Foro</h1>
  </div>
  <p class="meta">Conversaciones de tu red, organizadas por categorías.</p>

{{categorias}}

  <h2 style="margin-top:2.5rem">Nuevo hilo</h2>
  <form class="formulario" method="post" action="/foro/nuevo">
    <label>Título
      <input name="titulo" required maxlength="120">
    </label>
    <div class="dos-columnas" style="gap:1rem">
      <label>Categoría
        <select name="categoria" class="campo">
{{opciones_categoria}}
        </select>
      </label>
      <label>Tu nombre
        <input name="autor" placeholder="anonimo" maxlength="30">
      </label>
    </div>
    <label>Mensaje
      <textarea name="cuerpo" rows="6" required placeholder="Markdown sencillo permitido…"></textarea>
    </label>
    <button class="boton" type="submit">Publicar hilo</button>
  </form>
</section>
