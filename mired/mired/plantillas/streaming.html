<section class="panel">
  <div class="fila-titulo">
    <h1>Streaming</h1>
    <form class="inline-form" method="post" action="/streaming/subir" enctype="multipart/form-data">
      <input type="file" name="archivo" accept="audio/*,video/*" required>
      <button class="boton" type="submit">Subir música o vídeo</button>
    </form>
  </div>
  <p class="meta">Tu biblioteca multimedia personal. La música se guarda en
     <code>musica/</code> y los vídeos en <code>videos/</code> dentro de tu nube.</p>
  {{aviso}}

  <div class="foro-cat"><h2>Música</h2>
    <ul class="lista">
{{musica}}
    </ul>
  </div>

  <div class="foro-cat"><h2>Vídeos</h2>
    <ul class="lista">
{{videos}}
    </ul>
  </div>
</section>
