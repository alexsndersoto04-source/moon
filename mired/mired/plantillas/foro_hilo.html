<section class="panel">
  <div class="fila-titulo">
    <h1>{{titulo_hilo}}</h1>
    <div class="acciones">
      <a class="boton secundario" href="/foro/">← Volver al foro</a>
    </div>
  </div>
  <p class="meta">{{categoria}} · iniciado por {{autor}}</p>

{{posts}}

  <h2 style="margin-top:2.5rem">Responder</h2>
  <form class="formulario" method="post" action="/foro/responder">
    <input type="hidden" name="hilo_id" value="{{hilo_id}}">
    <label>Tu nombre
      <input name="autor" placeholder="anonimo" maxlength="30">
    </label>
    <label>Respuesta
      <textarea name="cuerpo" rows="5" required></textarea>
    </label>
    <button class="boton" type="submit">Publicar respuesta</button>
  </form>
</section>
