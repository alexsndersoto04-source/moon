<section class="panel">
  <h1>🔍 Buscador de MiRed</h1>
  <form class="buscador-hero" action="/buscar/" method="get">
    <input type="search" name="q" value="{{q}}" placeholder="Busca en tu red…" autocomplete="off" autofocus>
    <button type="submit">Buscar</button>
  </form>
  <p class="meta">{{total_documentos}} páginas indexadas ·
    <a href="/buscar/rastrear?volver=/buscar/">actualizar índice</a></p>
  <div class="resultados">
{{resultados}}
  </div>
  <p class="mensaje">{{mensaje}}</p>
</section>
