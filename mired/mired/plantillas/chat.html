<section class="panel">
  <div class="fila-titulo">
    <h1>Chat · #{{sala}}</h1>
    <div class="acciones">
      <label class="meta">nick
        <input id="nick" value="" placeholder="anonimo" style="width:9rem">
      </label>
      <label class="meta">sala
        <select id="sala" onchange="cambiarSala()">{{salas}}</select>
      </label>
    </div>
  </div>

  <div id="mensajes" class="chat-caja"></div>

  <form class="chat-form" onsubmit="return enviar(event)">
    <input id="texto" autocomplete="off" placeholder="Escribe un mensaje…" maxlength="500">
    <button class="boton" type="submit">Enviar</button>
  </form>
</section>

<script>
(function () {
  var nick = localStorage.getItem('mired_nick') || 'anonimo';
  document.getElementById('nick').value = nick;
  window.sala = {{sala_json}};
  window.desde = 0;

  window.pintar = function (m) {
    var caja = document.getElementById('mensajes');
    var div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = '<span class="chat-nick"></span> <span class="chat-hora meta"></span><div class="chat-texto"></div>';
    div.querySelector('.chat-nick').textContent = m.nick;
    div.querySelector('.chat-hora').textContent = m.creado_en || '';
    div.querySelector('.chat-texto').textContent = m.texto;
    caja.appendChild(div);
    caja.scrollTop = caja.scrollHeight;
    window.desde = Math.max(window.desde, m.id);
  };

  window.escuchar = async function () {
    try {
      var r = await fetch('/chat/mensajes?sala=' + encodeURIComponent(window.sala) +
                           '&desde=' + window.desde);
      var d = await r.json();
      d.mensajes.forEach(pintar);
    } catch (e) {
      await new Promise(function (r) { setTimeout(r, 2000); });
    }
    escuchar();
  };

  window.enviar = async function (ev) {
    ev.preventDefault();
    var texto = document.getElementById('texto');
    if (!texto.value.trim()) return false;
    localStorage.setItem('mired_nick', document.getElementById('nick').value || 'anonimo');
    await fetch('/chat/enviar', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'sala=' + encodeURIComponent(window.sala) +
            '&nick=' + encodeURIComponent(document.getElementById('nick').value) +
            '&texto=' + encodeURIComponent(texto.value)
    });
    texto.value = '';
    texto.focus();
    return false;
  };

  window.cambiarSala = function () {
    location.href = '/chat/?sala=' + encodeURIComponent(document.getElementById('sala').value);
  };

  escuchar();
  document.getElementById('texto').focus();
})();
</script>
