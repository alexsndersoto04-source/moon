<section class="panel">
  <div class="fila-titulo">
    <h1>Partida #{{partida_id}}</h1>
    <div class="acciones">
      <a class="boton secundario" href="/juegos/">Volver a juegos</a>
    </div>
  </div>
  <p class="meta" id="info-estado">Cargando…</p>
  <div class="tablero" id="tablero"></div>
</section>

<script>
(function () {
  var partida = {{partida_id}};
  var miFicha = null, version = 0, miNick = window.MIRED_USUARIO || localStorage.getItem('mired_nick') || 'anonimo';
  var caja = document.getElementById('tablero');

  for (var i = 0; i < 9; i++) {
    var b = document.createElement('button');
    b.className = 'casilla';
    b.dataset.pos = i;
    b.addEventListener('click', function () {
      if (!miFicha || !window._estado || window._estado.turno !== miFicha) return;
      fetch('/juegos/mover', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'partida=' + partida + '&posicion=' + this.dataset.pos + '&nick=' + encodeURIComponent(miNick)
      });
    });
    caja.appendChild(b);
  }

  function pintar(e) {
    window._estado = e;
    var info = document.getElementById('info-estado');
    if (e.jugador_x === miNick) miFicha = 'X';
    if (e.jugador_o === miNick) miFicha = 'O';
    var nombres = { X: e.jugador_x || '…', O: e.jugador_o || '…' };
    var texto;
    if (e.estado === 'esperando') texto = 'Esperando a un rival…';
    else if (e.estado === 'empate') texto = 'Empate.';
    else if (e.estado === 'finalizada') texto = 'Ganó ' + nombres[e.tablero[e.linea[0]]] + '.';
    else texto = 'Turno de ' + nombres[e.turno] + (miFicha ? ' (tú eres ' + miFicha + ')' : ' (espectador)');
    info.textContent = texto;
    var casillas = caja.children;
    for (var i = 0; i < 9; i++) {
      var v = e.tablero[i];
      casillas[i].textContent = v === '.' ? '' : v;
      casillas[i].disabled = (v !== '.') || e.estado !== 'jugando';
      casillas[i].classList.toggle('ganadora', e.linea.indexOf(i) >= 0);
    }
    version = e.version;
  }

  async function escuchar() {
    try {
      var r = await fetch('/juegos/estado?partida=' + partida + '&desde=' + version);
      pintar(await r.json());
    } catch (e) {
      await new Promise(function (r) { setTimeout(r, 2000); });
    }
    escuchar();
  }
  escuchar();
})();
</script>
