<section class="panel">
  <div class="fila-titulo">
    <h1>Nube</h1>
    <form class="inline-form" method="post" action="/nube/carpeta">
      <input type="hidden" name="dentro" value="{{carpeta}}">
      <input name="nombre" placeholder="Nueva carpeta" required maxlength="60">
      <button class="boton secundario" type="submit">Crear</button>
    </form>
  </div>
  <p class="meta">{{migas}}</p>
  {{aviso}}
  <form class="inline-form subida" method="post" action="/nube/subir" enctype="multipart/form-data">
    <input type="hidden" name="carpeta" value="{{carpeta}}">
    <input type="file" name="archivo" required>
    <button class="boton" type="submit">Subir archivo</button>
  </form>
  <ul class="lista">
{{elementos}}
  </ul>
</section>
