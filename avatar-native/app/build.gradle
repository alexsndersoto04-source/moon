plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alex.avatarhuman'
    compileSdk 34

    defaultConfig {
        applicationId "com.alex.avatarhuman"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ciKey = rootProject.file("../ci/avatar-humano.jks")
            def localKey = file(System.getProperty("user.home") + "/.android/debug.keystore")
            if (ciKey.exists()) {
                storeFile ciKey
                storePassword "avatarhumano"
                keyAlias "avatarhumano"
                keyPassword "avatarhumano"
            } else {
                storeFile localKey
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
